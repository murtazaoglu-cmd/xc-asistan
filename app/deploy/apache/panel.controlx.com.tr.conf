# XC Asistan WEB PANELİ: Apache sanal ana makine örneği (statik Flutter web derlemesi).
# Kopyalayın: /etc/apache2/sites-available/panel.controlx.com.tr.conf
# Gerekli modüller: sudo a2enmod ssl rewrite headers expires deflate mime
# `ALAN_ADI` (örn. panel-yeni.controlx.com.tr ya da panel.controlx.com.tr) ve sertifika yollarını düzenleyin.
# Sürüm klasörleri: /var/www/controlx/panel-web/releases/<tarih>, canlı olan: /var/www/controlx/panel-web/current (symlink)

<VirtualHost *:80>
    ServerName ALAN_ADI
    # Let's Encrypt (certbot --webroot) doğrulaması için kök açık kalır; geri kalanı HTTPS'e gider.
    DocumentRoot /var/www/controlx/panel-web/current
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName ALAN_ADI
    DocumentRoot /var/www/controlx/panel-web/current

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/ALAN_ADI/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ALAN_ADI/privkey.pem

    ErrorLog  ${APACHE_LOG_DIR}/panel-web-error.log
    CustomLog ${APACHE_LOG_DIR}/panel-web-access.log combined

    <Directory /var/www/controlx/panel-web/current>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # SPA yönlendirmesi: dosya/klasör olmayan her yol index.html'e düşer (/customers/123, F5, derin bağlantı).
        # Var olmayan statik dosya (ör. /assets/x.png) 404 kalır; uzantısız yollar uygulamaya gider.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} !\.[a-zA-Z0-9]{1,6}$
        RewriteRule ^ /index.html [L]
    </Directory>

    # --- MIME türleri (wasm yanlış türde sunulursa CanvasKit açılmaz: beyaz ekran) ---
    AddType application/wasm .wasm
    AddType application/javascript .js .mjs
    AddType application/manifest+json .webmanifest
    AddDefaultCharset UTF-8

    # --- Sıkıştırma ---
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json application/wasm image/svg+xml text/plain
    </IfModule>

    # --- Önbellek ---
    # Giriş noktaları ve uygulama kodu HER ZAMAN yeniden doğrulanır (ETag; değişmediyse 304): yeni sürüm
    # kullanıcıya hemen ulaşır. Yalnız simgeler uzun süre önbelleğe alınır.
    <IfModule mod_headers.c>
        Header set Cache-Control "no-cache"
        <FilesMatch "\.(png|ico|jpg|jpeg|webp|svg|woff2?|otf|ttf)$">
            Header set Cache-Control "public, max-age=2592000"
        </FilesMatch>
        # Servis çalışanı ve sürüm dosyası ASLA önbelleğe alınmaz.
        <FilesMatch "^(flutter_service_worker\.js|version\.json|index\.html|flutter_bootstrap\.js|boot\.js|manifest\.json)$">
            Header set Cache-Control "no-store, max-age=0"
        </FilesMatch>

        # --- Güvenlik başlıkları ---
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
        Header always set Cross-Origin-Opener-Policy "same-origin"
        Header always set Cross-Origin-Resource-Policy "same-origin"
        # CSP: betikler yalnız kendi kökenimizden (+ CanvasKit için 'wasm-unsafe-eval'); API yalnız api.controlx.com.tr.
        # style-src 'unsafe-inline': Flutter çalışma anında <style> ekler. Satır içi BETİK yoktur.
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.controlx.com.tr; font-src 'self' data:; connect-src 'self' https://api.controlx.com.tr blob: data:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    </IfModule>

    # Arama motorları paneli dizinlemesin
    Header set X-Robots-Tag "noindex, nofollow"
</VirtualHost>
